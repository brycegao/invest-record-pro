[package]
name = "invest-record-pro"
version = "0.1.0"
description = "Personal investment decision record system"
authors = ["invest-record-pro"]
edition = "2021"

[lib]
name = "invest_record_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
